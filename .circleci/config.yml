    parallelism: 20
    machine:
      image: ubuntu-2204:current
    resource_class: 2xlarge+.gen2
    steps:
      - checkout
      - run:
          name: vertkal
          command: |
                 python3 app.py

  build2: *build_template
  build3: *build_template
  build4: *build_template

workflows:
  version: 2
